name: 24/7 CYBERMOKSHA Live Stream Engine

concurrency:
  group: cybermoksha-single-stream
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      stream_mode:
        description: 'Broadcast Mode'
        required: true
        default: 'week2_daily'
        type: choice
        options:
          - 'week2_daily'
          - 'week2_full_70min'
          - 'week1_daily'
  schedule:
    # Autonomous Watchdog: Runs every 30 minutes. If no stream runner is active, revives broadcast immediately!
    - cron: '*/30 * * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cron Watchdog Guard (Prevent Duplicate Active Streams)
        if: github.event_name == 'schedule'
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Scheduled watchdog wake-up. Verifying if a live stream runner is currently active..."
          python3 - << 'EOF'
          import urllib.request, json, os, sys

          pat = os.environ.get('GH_PAT')
          headers = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'CyberMoksha-Watchdog'
          }
          if pat:
              headers['Authorization'] = f'Bearer {pat}'

          current_run_id = int(os.environ.get('GITHUB_RUN_ID', '0'))
          url = 'https://api.github.com/repos/madpunks007/cybermoksha-stream-engine/actions/workflows/stream.yml/runs?status=in_progress'

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  other_runs = [r['id'] for r in data.get('workflow_runs', []) if r['id'] != current_run_id]
                  if other_runs:
                      print(f"[+] Active streaming runner is already running: {other_runs}. Watchdog exiting cleanly.")
                      sys.exit(99)
                  else:
                      print("[!] No active streaming runner found! Watchdog reviving stream broadcast immediately!")
          except Exception as e:
              print(f"[-] Watchdog check notice: {e}. Proceeding with stream broadcast.")
          EOF
          if [ $? -eq 99 ]; then
            echo "SKIP_STREAM=true" >> $GITHUB_ENV
          fi

      - name: Verify FFmpeg
        if: env.SKIP_STREAM != 'true'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Select Daily Master Video (Week 2 Autonomous)
        if: env.SKIP_STREAM != 'true'
        run: |
          MODE="${{ github.event.inputs.stream_mode || 'week2_daily' }}"
          DAY_NUM=$(date +%u)
          echo "[+] Selected Stream Mode: $MODE"
          echo "[+] Today is Day of Week: $DAY_NUM (1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 7=Sun)"

          DOMAIN="github.com"
          REPO="madpunks007/cybermoksha-stream-engine"

          if [ "$MODE" = "week2_daily" ]; then
            RELEASE_TAG="v2.0"
            case $DAY_NUM in
              1) VIDEO="Master_W2_Day1_Mon_NeonTokyo.mp4" ;;
              2) VIDEO="Master_W2_Day2_Tue_DeepSpace.mp4" ;;
              3) VIDEO="Master_W2_Day3_Wed_SynthHighway.mp4" ;;
              4) VIDEO="Master_W2_Day4_Thu_OrbitalStation.mp4" ;;
              5) VIDEO="Master_W2_Day5_Fri_UnderwaterDome.mp4" ;;
              6) VIDEO="Master_W2_Day6_Sat_CyberZen.mp4" ;;
              7) VIDEO="Master_W2_Day7_Sun_AstralHorizon.mp4" ;;
            esac
          elif [ "$MODE" = "week2_full_70min" ]; then
            VIDEO="Master_Week2_Full7Days_70Min.mp4"
            RELEASE_TAG="v2.0"
          else
            RELEASE_TAG="v1.0"
            case $DAY_NUM in
              1) VIDEO="CyberMoksha_SacredTemple_Devotional_Master_10Min.mp4" ;;
              2) VIDEO="CyberMoksha_Day2_Tuesday_CozyCabin_Master_10Min.mp4" ;;
              3) VIDEO="CyberMoksha_Day3_Wednesday_Varanasi_Master_10Min.mp4" ;;
              4) VIDEO="CyberMoksha_Day4_Thursday_RainyLoft_Master_10Min.mp4" ;;
              5) VIDEO="CyberMoksha_Day5_Friday_Himalayan_Master_10Min.mp4" ;;
              6) VIDEO="CyberMoksha_Day6_Saturday_AutumnLibrary_Master_10Min.mp4" ;;
              7) VIDEO="CyberMoksha_Day7_Sunday_ZenGarden_Master_10Min.mp4" ;;
            esac
          fi

          echo "SELECTED_VIDEO=$VIDEO" >> $GITHUB_ENV
          echo "[+] Downloading $VIDEO from Release $RELEASE_TAG..."
          wget -q --show-progress "https://${DOMAIN}/${REPO}/releases/download/${RELEASE_TAG}/${VIDEO}"

          if [ ! -f "$VIDEO" ] || [ ! -s "$VIDEO" ]; then
            echo "[-] Fallback: Downloading via GitHub CLI..."
            gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "$VIDEO" || true
          fi
          ls -lh "$VIDEO"

      - name: Broadcast to YouTube Live (Resilient Auto-Reconnect Loop)
        if: env.SKIP_STREAM != 'true'
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "[-] ERROR: YOUTUBE_STREAM_KEY secret is not set!"
            exit 1
          fi

          TOTAL_DURATION=20700   # 5 hours 45 minutes
          START_TIME=$(date +%s)
          TARGET_END=$((START_TIME + TOTAL_DURATION))
          HOST="a.rtmp.youtube.com"

          echo "[+] Starting 24/7 stream broadcast. Target duration: ${TOTAL_DURATION}s (~5h 45m)"

          # Pre-dispatch next runner 60 seconds before this runner completes for zero downtime
          (
            SLEEP_SECS=$((TOTAL_DURATION - 60))
            if [ $SLEEP_SECS -gt 0 ]; then
              sleep $SLEEP_SECS
              echo "[+] Handover: 60s remaining. Pre-dispatching next runner..."
              curl -s -f -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_PAT}" \
                "https://api.github.com/repos/madpunks007/cybermoksha-stream-engine/actions/workflows/stream.yml/dispatches" \
                -d '{"ref":"main"}' && touch /tmp/early_dispatched || echo "[!] Pre-dispatch attempt completed."
            fi
          ) &
          DISPATCH_PID=$!

          # Resilient loop: If YouTube RTMP resets, network drops, or broken pipe occurs, reconnect immediately!
          while true; do
            NOW=$(date +%s)
            REMAINING=$((TARGET_END - NOW))

            if [ $REMAINING -le 15 ]; then
              echo "[+] Target stream duration reached ($REMAINING seconds remaining). Gracefully handing over."
              break
            fi

            echo "[*] [$(date '+%Y-%m-%d %H:%M:%S')] Broadcasting to YouTube Live ($REMAINING seconds left in cycle)..."
            ffmpeg -loglevel warning -fflags +genpts -re -stream_loop -1 -i "$SELECTED_VIDEO" \
              -c:v copy -c:a aac -b:a 192k -ar 44100 -ac 2 \
              -t "$REMAINING" \
              -flvflags no_duration_filesize -f flv "rtmp://${HOST}/live2/${YOUTUBE_STREAM_KEY}" || true

            NOW=$(date +%s)
            REMAINING=$((TARGET_END - NOW))
            if [ $REMAINING -gt 15 ]; then
              echo "[!] Connection dropped (YouTube RTMP reset or packet timeout). Auto-reconnecting in 2 seconds..."
              sleep 2
            fi
          done

          wait $DISPATCH_PID 2>/dev/null || true

      - name: Fail-Safe Auto-Restart Relay (Self-Chaining)
        if: always() && !cancelled() && env.SKIP_STREAM != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -f /tmp/early_dispatched ]; then
            echo "[+] Next relay runner was already pre-dispatched successfully."
          else
            echo "[+] Triggering next 24/7 stream relay runner via GitHub Actions REST API..."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_PAT}" \
              "https://api.github.com/repos/madpunks007/cybermoksha-stream-engine/actions/workflows/stream.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
