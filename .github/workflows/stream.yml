name: 24/7 CYBERMOKSHA Dual-Stream Engine (16:9 + 9:16 Shorts Live)

on:
  workflow_dispatch:
    inputs:
      stream_mode:
        description: 'Broadcast Mode'
        required: true
        default: 'v3_dual'
        type: choice
        options:
          - 'v3_dual'
          - 'week2_daily'
          - 'week1_daily'
  schedule:
    # Autonomous Watchdog: runs every 15 minutes independently of the stream concurrency lock
    - cron: '*/15 * * * *'

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify GitHub Runner & Live YouTube Broadcast Health
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, time
          from datetime import datetime, timezone

          pat = os.environ.get('GH_PAT', '')
          gh_headers = {
              'Authorization': f'Bearer {pat}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'CyberMoksha-Watchdog'
          }
          repo = 'madpunks007/cybermoksha-stream-engine'
          current_run_id = int(os.environ.get('GITHUB_RUN_ID', '0'))

          def gh_api(path, method='GET', body=None):
              url = f'https://api.github.com/repos/{repo}/{path}'
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=gh_headers, method=method)
              with urllib.request.urlopen(req, timeout=15) as r:
                  raw = r.read().decode()
                  return json.loads(raw) if raw else {}

          active = []
          for st in ('in_progress', 'queued', 'pending'):
              res = gh_api(f'actions/workflows/stream.yml/runs?status={st}&per_page=10')
              for r in res.get('workflow_runs', []):
                  if r['id'] != current_run_id and r.get('event') != 'schedule':
                      active.append(r)

          is_yt_live = False
          yt_vid = None
          try:
              yt_req = urllib.request.Request(
                  'https://www.youtube.com/channel/UCN9dBYToqkaQEP5MihFRG_Q/live',
                  headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
              )
              html = urllib.request.urlopen(yt_req, timeout=15).read().decode('utf-8', 'ignore')
              is_yt_live = '"isLive":true' in html or '"isLiveNow":true' in html
              idx = html.find('"videoId":"')
              if idx != -1:
                  yt_vid = html[idx+11:idx+22]
          except Exception as e:
              print(f'[!] YouTube HTTP probe error: {e}')
              is_yt_live = True

          print(f'[*] Active stream runs: {[r["id"] for r in active]} | YouTube isLive={is_yt_live} (vid={yt_vid})')

          now = datetime.now(timezone.utc)
          if not active:
              print('[!] No active stream runner found! Dispatching new dual-stream runner immediately...')
              gh_api('actions/workflows/stream.yml/dispatches', method='POST', body={'ref': 'main', 'inputs': {'stream_mode': 'v3_dual'}})
          else:
              oldest_age_sec = max(
                  (now - datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))).total_seconds()
                  for r in active
              )
              if oldest_age_sec > 300 and not is_yt_live:
                  print('[!] Runner active >5m but YouTube reports OFFLINE (likely 12h split or stall)! Auto-recovering...')
                  for r in active:
                      try:
                          gh_api(f'actions/runs/{r["id"]}/cancel', method='POST')
                      except Exception:
                          pass
                  time.sleep(5)
                  gh_api('actions/workflows/stream.yml/dispatches', method='POST', body={'ref': 'main', 'inputs': {'stream_mode': 'v3_dual'}})
              else:
                  print('[+] Stream healthy! Watchdog exiting cleanly.')
          EOF

  stream:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: cybermoksha-single-stream
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify FFmpeg & Fonts
        run: |
          if ! command -v ffmpeg &> /dev/null || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1

      - name: Select Daily Smooth Master Video (v3.0 Upgraded Audio)
        run: |
          MODE="${{ github.event.inputs.stream_mode || 'v3_dual' }}"
          DAY_NUM=$(date +%u)
          DOMAIN="github.com"
          REPO="madpunks007/cybermoksha-stream-engine"

          if [ "$MODE" = "v3_dual" ]; then
            RELEASE_TAG="v3.0"
            case $DAY_NUM in
              1) VIDEO="Master_W3_Day1_Mon_NeonTokyo.mp4" ;;
              2) VIDEO="Master_W3_Day2_Tue_DeepSpace.mp4" ;;
              3) VIDEO="Master_W3_Day3_Wed_SynthCity.mp4" ;;
              4) VIDEO="Master_W3_Day4_Thu_CozyRoom.mp4" ;;
              5) VIDEO="Master_W3_Day5_Fri_UnderwaterDome.mp4" ;;
              6) VIDEO="Master_W3_Day6_Sat_CyberZen.mp4" ;;
              7) VIDEO="Master_W3_Day7_Sun_AstralSunset.mp4" ;;
            esac
          elif [ "$MODE" = "week2_daily" ]; then
            RELEASE_TAG="v2.0"
            case $DAY_NUM in
              1) VIDEO="Master_W2_Day1_Mon_NeonTokyo.mp4" ;;
              2) VIDEO="Master_W2_Day2_Tue_DeepSpace.mp4" ;;
              3) VIDEO="Master_W2_Day3_Wed_SynthHighway.mp4" ;;
              4) VIDEO="Master_W2_Day4_Thu_OrbitalStation.mp4" ;;
              5) VIDEO="Master_W2_Day5_Fri_UnderwaterDome.mp4" ;;
              6) VIDEO="Master_W2_Day6_Sat_CyberZen.mp4" ;;
              7) VIDEO="Master_W2_Day7_Sun_AstralHorizon.mp4" ;;
            esac
          else
            RELEASE_TAG="v1.0"
            case $DAY_NUM in
              1) VIDEO="CyberMoksha_SacredTemple_Devotional_Master_10Min.mp4" ;;
              2) VIDEO="CyberMoksha_Day2_Tuesday_CozyCabin_Master_10Min.mp4" ;;
              3) VIDEO="CyberMoksha_Day3_Wednesday_Varanasi_Master_10Min.mp4" ;;
              4) VIDEO="CyberMoksha_Day4_Thursday_RainyLoft_Master_10Min.mp4" ;;
              5) VIDEO="CyberMoksha_Day5_Friday_Himalayan_Master_10Min.mp4" ;;
              6) VIDEO="CyberMoksha_Day6_Saturday_AutumnLibrary_Master_10Min.mp4" ;;
              7) VIDEO="CyberMoksha_Day7_Sunday_ZenGarden_Master_10Min.mp4" ;;
            esac
          fi

          echo "SELECTED_VIDEO=$VIDEO" >> $GITHUB_ENV
          wget -q --show-progress "https://${DOMAIN}/${REPO}/releases/download/${RELEASE_TAG}/${VIDEO}" || gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "$VIDEO"
          ls -lh "$VIDEO"

      - name: Broadcast Dual 16:9 + 9:16 Vertical Shorts Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_VERTICAL_STREAM_KEY: ${{ secrets.YOUTUBE_VERTICAL_STREAM_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "[-] ERROR: YOUTUBE_STREAM_KEY secret is not set!"
            exit 1
          fi

          TOTAL_DURATION=20700   # 5 hours 45 minutes (<6h for clean VOD archival!)
          START_TIME=$(date +%s)
          TARGET_END=$((START_TIME + TOTAL_DURATION))
          HOST="a.rtmp.youtube.com"

          (
            SLEEP_SECS=$((TOTAL_DURATION - 60))
            if [ $SLEEP_SECS -gt 0 ]; then
              sleep $SLEEP_SECS
              curl -s -f -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_PAT}" \
                "https://api.github.com/repos/madpunks007/cybermoksha-stream-engine/actions/workflows/stream.yml/dispatches" \
                -d '{"ref":"main"}' && touch /tmp/early_dispatched || true
            fi
          ) &
          DISPATCH_PID=$!

          FILTER_COMPLEX="[0:v]fps=30,split=2[v1][v2];[v1]scale=1920:1080,format=yuv420p[out_16x9];[v2]split=2[bg_src][fg_src];[bg_src]scale=270:480:flags=fast_bilinear,boxblur=4:2,eq=brightness=-0.18,scale=1080:1920:flags=bilinear[bg];[fg_src]scale=1080:-1:flags=fast_bilinear[fg];[bg][fg]overlay=(W-w)/2:470,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='24/7 SYNTHWAVE RADIO':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=190:shadowcolor=black@0.85:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Full Widescreen & Study Mixes on Channel':fontcolor=#cbd5e1:fontsize=30:x=(w-text_w)/2:y=268:shadowcolor=black@0.85:shadowx=2:shadowy=2,format=yuv420p[out_9x16]"

          RAPID_FAILS=0
          USE_DUAL=true
          if [ -z "$YOUTUBE_VERTICAL_STREAM_KEY" ]; then
            echo "[!] YOUTUBE_VERTICAL_STREAM_KEY not set — streaming 16:9 solo."
            USE_DUAL=false
          fi

          while true; do
            NOW=$(date +%s)
            REMAINING=$((TARGET_END - NOW))
            if [ $REMAINING -le 15 ]; then
              echo "[+] Target stream cycle reached ($REMAINING seconds left). Handing over."
              break
            fi

            ITER_START=$(date +%s)
            if [ "$USE_DUAL" = true ]; then
              echo "[*] Dual-Stream Live (16:9 + 9:16 Shorts) | ${REMAINING}s remaining..."
              ffmpeg -loglevel warning -fflags +genpts -re -stream_loop -1 -i "$SELECTED_VIDEO" \
                -threads 0 -filter_complex "$FILTER_COMPLEX" \
                -map "[out_16x9]" -map 0:a -t "$REMAINING" -c:v libx264 -preset superfast -b:v 4500k -maxrate 4500k -bufsize 9000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -flvflags no_duration_filesize -f flv "rtmp://${HOST}/live2/${YOUTUBE_STREAM_KEY}" \
                -map "[out_9x16]" -map 0:a -t "$REMAINING" -c:v libx264 -preset superfast -b:v 3000k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -flvflags no_duration_filesize -f flv "rtmp://${HOST}/live2/${YOUTUBE_VERTICAL_STREAM_KEY}" || true
            else
              echo "[*] Single-Stream Live (16:9 Fallback) | ${REMAINING}s remaining..."
              ffmpeg -loglevel warning -fflags +genpts -re -stream_loop -1 -i "$SELECTED_VIDEO" \
                -t "$REMAINING" -c:v copy -c:a aac -b:a 128k -ar 44100 -flvflags no_duration_filesize -f flv "rtmp://${HOST}/live2/${YOUTUBE_STREAM_KEY}" || true
            fi

            ITER_DUR=$(( $(date +%s) - ITER_START ))
            NOW=$(date +%s)
            REMAINING=$((TARGET_END - NOW))
            if [ $REMAINING -gt 15 ]; then
              if [ $ITER_DUR -lt 10 ] && [ "$USE_DUAL" = true ]; then
                RAPID_FAILS=$((RAPID_FAILS + 1))
                echo "[!] Rapid disconnect ($ITER_DUR s, fail #$RAPID_FAILS)."
                if [ $RAPID_FAILS -ge 3 ]; then
                  echo "[!] Vertical RTMP hiccup detected 3x in a row — falling back to 16:9 solo so main stream stays protected!"
                  USE_DUAL=false
                fi
              else
                RAPID_FAILS=0
              fi
              sleep 2
            fi
          done

          wait $DISPATCH_PID 2>/dev/null || true

      - name: Fail-Safe Auto-Restart Relay (Self-Chaining)
        if: always() && !cancelled()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f /tmp/early_dispatched ]; then
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_PAT}" \
              "https://api.github.com/repos/madpunks007/cybermoksha-stream-engine/actions/workflows/stream.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
