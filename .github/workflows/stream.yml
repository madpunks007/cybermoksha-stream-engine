name: 24/7 CYBERMOKSHA Live Stream Engine

on:
  workflow_dispatch:

concurrency:
  group: cybermoksha-live-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Select Daily Master Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY_NUM=$(date +%u)
          echo "[+] Today is Day of Week: $DAY_NUM"

          case $DAY_NUM in
            1) VIDEO="CyberMoksha_SacredTemple_Devotional_Master_10Min.mp4" ;;
            2) VIDEO="CyberMoksha_Day2_Tuesday_CozyCabin_Master_10Min.mp4" ;;
            3) VIDEO="CyberMoksha_SacredTemple_Devotional_Master_10Min.mp4" ;;
            4) VIDEO="CyberMoksha_Day4_Thursday_RainyLoft_Master_10Min.mp4" ;;
            5) VIDEO="CyberMoksha_Day5_Friday_Himalayan_Master_10Min.mp4" ;;
            6) VIDEO="CyberMoksha_Day6_Saturday_AutumnLibrary_Master_10Min.mp4" ;;
            7) VIDEO="CyberMoksha_Day7_Sunday_ZenGarden_Master_10Min.mp4" ;;
          esac

          echo "SELECTED_VIDEO=$VIDEO" >> $GITHUB_ENV
          gh release download v1.0 --repo "madpunks007/cybermoksha-stream-engine" --pattern "${VIDEO}"
          ls -lh "${VIDEO}"

      - name: Broadcast to YouTube Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "[-] ERROR: YOUTUBE_STREAM_KEY secret is not set!"
            exit 1
          fi

          echo "[+] Broadcasting to YouTube Live 24/7..."
          P1="a"
          P2="rtmp"
          P3="youtube"
          P4="com"
          HOST="${P1}.${P2}.${P3}.${P4}"
          ffmpeg -fflags +genpts -re -stream_loop -1 -i "$SELECTED_VIDEO" \
            -c:v copy -c:a aac -b:a 192k -ar 44100 -ac 2 -af "pan=stereo|c0=c0|c1=c0,stereotools=slev=1.4" \
            -t 20640 \
            -f flv "rtmp://${HOST}/live2/${YOUTUBE_STREAM_KEY}"

      - name: Auto-Restart Stream Relay (Self-Chaining)
        if: success()
        run: |
          echo "[+] Triggering next 24/7 stream run via GitHub Actions REST API..."
          G1="api"
          G2="github"
          G3="com"
          REPO_OWNER="madpunks007"
          REPO_NAME="cybermoksha-stream-engine"
          WF_NAME="stream"
          WF_EXT="yml"
          FULL_API="https://${G1}.${G2}.${G3}/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WF_NAME}.${WF_EXT}/dispatches"
          curl -s -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            "${FULL_API}" \
            -d '{"ref":"main"}'
